<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280">
  <defs>
    <linearGradient id="tidal1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E90FF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00BFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000080;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="tidalGlow" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#B0E0E6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#000080;stop-opacity:0.3" />
    </radialGradient>
  </defs>
  
  <rect width="200" height="280" fill="url(#tidal1)" rx="8"/>
  <rect x="4" y="4" width="192" height="272" fill="none" stroke="#1E90FF" stroke-width="2" rx="6"/>
  
  <rect x="8" y="8" width="184" height="32" fill="#fff" opacity="0.9" rx="4"/>
  <text x="16" y="28" font-family="Arial" font-size="14" font-weight="bold" fill="#000080">Tidal Leviathan</text>
  <rect x="130" y="12" width="50" height="24" fill="#000080" rx="3"/>
  <text x="160" y="27" font-family="Arial" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">WATER</text>
  
  <rect x="10" y="45" width="180" height="140" fill="url(#tidalGlow)" rx="4"/>
  
  <!-- Large sea creature -->
  <ellipse cx="100" cy="105" rx="45" ry="35" fill="#00BFFF"/>
  <circle cx="100" cy="75" r="20" fill="#0099CC"/>
  
  <!-- Fins -->
  <ellipse cx="65" cy="95" rx="12" ry="25" fill="#1E90FF" opacity="0.8"/>
  <ellipse cx="135" cy="95" rx="12" ry="25" fill="#1E90FF" opacity="0.8"/>
  
  <!-- Back fin -->
  <polygon points="100,65 95,45 105,45" fill="#00BFFF"/>
  
  <!-- Water bubbles -->
  <circle cx="55" cy="80" r="5" fill="#87CEEB" opacity="0.6"/>
  <circle cx="145" cy="95" r="6" fill="#87CEEB" opacity="0.6"/>
  <circle cx="70" cy="125" r="4" fill="#87CEEB" opacity="0.6"/>
  
  <!-- Eyes -->
  <circle cx="90" cy="70" r="3" fill="#000"/>
  <circle cx="110" cy="70" r="3" fill="#000"/>
  
  <rect x="10" y="190" width="180" height="50" fill="#fff" opacity="0.85" rx="3"/>
  <text x="16" y="207" font-family="Arial" font-size="10" font-weight="bold" fill="#333">HP: 125</text>
  <text x="16" y="222" font-family="Arial" font-size="10" font-weight="bold" fill="#333">ATK: 80 | DEF: 95</text>
  <text x="16" y="237" font-family="Arial" font-size="9" fill="#666">Largest water creature</text>
  
  <rect x="8" y="248" width="184" height="24" fill="#000080" rx="3"/>
  <text x="100" y="263" font-family="Arial" font-size="10" font-weight="bold" fill="#fff" text-anchor="middle">⚔ Battle Card</text>
</svg>