<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280">
  <defs>
    <linearGradient id="volt1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFF00;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6347;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="voltGlow" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#FFFACD;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#FF4500;stop-opacity:0.3" />
    </radialGradient>
  </defs>
  
  <rect width="200" height="280" fill="url(#volt1)" rx="8"/>
  <rect x="4" y="4" width="192" height="272" fill="none" stroke="#FFFF00" stroke-width="2" rx="6"/>
  
  <rect x="8" y="8" width="184" height="32" fill="#fff" opacity="0.9" rx="4"/>
  <text x="16" y="28" font-family="Arial" font-size="16" font-weight="bold" fill="#FF4500">Volt Phoenix</text>
  <rect x="130" y="12" width="50" height="24" fill="#FF4500" rx="3"/>
  <text x="160" y="27" font-family="Arial" font-size="10" font-weight="bold" fill="#fff" text-anchor="middle">ELECTRIC</text>
  
  <rect x="10" y="45" width="180" height="140" fill="url(#voltGlow)" rx="4"/>
  
  <!-- Phoenix bird body -->
  <ellipse cx="100" cy="110" rx="25" ry="20" fill="#FF6347"/>
  <circle cx="100" cy="80" r="18" fill="#FF4500"/>
  
  <!-- Wings -->
  <path d="M 80 100 Q 55 85 50 110 Q 60 105 80 110" fill="#FF6347" opacity="0.9"/>
  <path d="M 120 100 Q 145 85 150 110 Q 140 105 120 110" fill="#FF6347" opacity="0.9"/>
  
  <!-- Tail feathers -->
  <path d="M 90 115 Q 70 130 60 140 Q 75 130 90 120" fill="#FFA500" opacity="0.8"/>
  <path d="M 100 120 Q 85 145 80 160 Q 100 140 105 120" fill="#FFD700" opacity="0.8"/>
  <path d="M 110 115 Q 130 130 140 140 Q 125 130 110 120" fill="#FFA500" opacity="0.8"/>
  
  <!-- Crest on head -->
  <polygon points="100,60 95,50 100,55 105,50" fill="#FF8C00"/>
  <polygon points="100,65 92,52 100,62 108,52" fill="#FF6347"/>
  
  <!-- Eyes -->
  <circle cx="90" cy="75" r="3" fill="#000"/>
  <circle cx="110" cy="75" r="3" fill="#000"/>
  
  <!-- Lightning aura -->
  <path d="M 60 90 L 55 75" stroke="#FFD700" stroke-width="1.5" opacity="0.7"/>
  <path d="M 140 90 L 145 75" stroke="#FFD700" stroke-width="1.5" opacity="0.7"/>
  
  <rect x="10" y="190" width="180" height="50" fill="#fff" opacity="0.85" rx="3"/>
  <text x="16" y="207" font-family="Arial" font-size="10" font-weight="bold" fill="#333">HP: 105</text>
  <text x="16" y="222" font-family="Arial" font-size="10" font-weight="bold" fill="#333">ATK: 110 | DEF: 65</text>
  <text x="16" y="237" font-family="Arial" font-size="9" fill="#666">Swift bird piercing attacks</text>
  
  <rect x="8" y="248" width="184" height="24" fill="#FF4500" rx="3"/>
  <text x="100" y="263" font-family="Arial" font-size="10" font-weight="bold" fill="#fff" text-anchor="middle">⚔ Battle Card</text>
</svg>