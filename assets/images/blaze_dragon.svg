<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280">
  <!-- Card background with gradient -->
  <defs>
    <linearGradient id="fireCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6B35;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="blazeGlow" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#FFE4B5;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:0.3" />
    </radialGradient>
  </defs>
  
  <!-- Card frame -->
  <rect width="200" height="280" fill="url(#fireCardGrad)" rx="8"/>
  <rect x="4" y="4" width="192" height="272" fill="none" stroke="#FFD700" stroke-width="2" rx="6"/>
  
  <!-- Top section: Card name and type -->
  <rect x="8" y="8" width="184" height="32" fill="#fff" opacity="0.9" rx="4"/>
  <text x="16" y="28" font-family="Arial" font-size="16" font-weight="bold" fill="#FF6B35">Blaze Dragon</text>
  <rect x="140" y="12" width="40" height="24" fill="#FF6B35" rx="3"/>
  <text x="150" y="27" font-family="Arial" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">FIRE</text>
  
  <!-- Main illustration area -->
  <rect x="10" y="45" width="180" height="140" fill="url(#blazeGlow)" rx="4"/>
  
  <!-- Dragon body with flames -->
  <ellipse cx="100" cy="85" rx="35" ry="40" fill="#FF4500"/>
  <polygon points="100,50 85,70 115,70" fill="#FFD700"/>
  <polygon points="85,50 75,65 90,70" fill="#FFA500"/>
  <polygon points="115,50 125,65 110,70" fill="#FFA500"/>
  
  <!-- Dragon head -->
  <circle cx="100" cy="110" r="25" fill="#DC143C"/>
  <circle cx="92" cy="105" r="5" fill="#fff"/>
  <circle cx="108" cy="105" r="5" fill="#fff"/>
  <circle cx="92" cy="105" r="3" fill="#000"/>
  <circle cx="108" cy="105" r="3" fill="#000"/>
  
  <!-- Flame effects -->
  <path d="M 65 100 Q 55 85 60 70 Q 70 80 65 100" fill="#FFD700" opacity="0.8"/>
  <path d="M 135 100 Q 145 85 140 70 Q 130 80 135 100" fill="#FFD700" opacity="0.8"/>
  
  <!-- Stats section -->
  <rect x="10" y="190" width="180" height="50" fill="#fff" opacity="0.85" rx="3"/>
  <text x="16" y="207" font-family="Arial" font-size="10" font-weight="bold" fill="#333">HP: 120</text>
  <text x="16" y="222" font-family="Arial" font-size="10" font-weight="bold" fill="#333">ATK: 95 | DEF: 80</text>
  <text x="16" y="237" font-family="Arial" font-size="9" fill="#666">A powerful fire dragon</text>
  
  <!-- Bottom decorative bar -->
  <rect x="8" y="248" width="184" height="24" fill="#FF6B35" rx="3"/>
  <text x="100" y="263" font-family="Arial" font-size="10" font-weight="bold" fill="#fff" text-anchor="middle">⚔ Battle Card</text>
</svg>