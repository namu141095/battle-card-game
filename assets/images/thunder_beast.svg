<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280">
  <defs>
    <linearGradient id="electricCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFF99;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFFF00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="boltGlow" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#FFFACD;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#DAA520;stop-opacity:0.3" />
    </radialGradient>
  </defs>
  
  <rect width="200" height="280" fill="url(#electricCardGrad)" rx="8"/>
  <rect x="4" y="4" width="192" height="272" fill="none" stroke="#FFFF00" stroke-width="2" rx="6"/>
  
  <rect x="8" y="8" width="184" height="32" fill="#fff" opacity="0.9" rx="4"/>
  <text x="16" y="28" font-family="Arial" font-size="16" font-weight="bold" fill="#DAA520">Thunder Beast</text>
  <rect x="130" y="12" width="50" height="24" fill="#DAA520" rx="3"/>
  <text x="160" y="27" font-family="Arial" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">ELECTRIC</text>
  
  <rect x="10" y="45" width="180" height="140" fill="url(#boltGlow)" rx="4"/>
  
  <!-- Lightning creature -->
  <circle cx="100" cy="100" r="28" fill="#FFD700"/>
  <circle cx="100" cy="100" r="25" fill="#FFFF00" opacity="0.9"/>
  
  <!-- Spikes around creature -->
  <polygon points="100,50 105,65 100,75 95,65" fill="#DAA520"/>
  <polygon points="150,100 135,95 135,105 150,100" fill="#DAA520"/>
  <polygon points="50,100 65,95 65,105 50,100" fill="#DAA520"/>
  <polygon points="100,150 105,135 100,125 95,135" fill="#DAA520"/>
  
  <!-- Lightning bolts emanating -->
  <path d="M 60 70 L 55 55 L 60 60" stroke="#FFD700" stroke-width="2" fill="none"/>
  <path d="M 140 70 L 145 55 L 140 60" stroke="#FFD700" stroke-width="2" fill="none"/>
  
  <!-- Eyes -->
  <circle cx="90" cy="95" r="4" fill="#000"/>
  <circle cx="110" cy="95" r="4" fill="#000"/>
  
  <rect x="10" y="190" width="180" height="50" fill="#fff" opacity="0.85" rx="3"/>
  <text x="16" y="207" font-family="Arial" font-size="10" font-weight="bold" fill="#333">HP: 95</text>
  <text x="16" y="222" font-family="Arial" font-size="10" font-weight="bold" fill="#333">ATK: 105 | DEF: 70</text>
  <text x="16" y="237" font-family="Arial" font-size="9" fill="#666">Fastest attacker with power</text>
  
  <rect x="8" y="248" width="184" height="24" fill="#DAA520" rx="3"/>
  <text x="100" y="263" font-family="Arial" font-size="10" font-weight="bold" fill="#fff" text-anchor="middle">⚔ Battle Card</text>
</svg>