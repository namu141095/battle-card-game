<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="sparkle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFA500;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#FF6347;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Star burst effect -->
  <g id="sparkle-group" stroke="url(#sparkle)" stroke-width="2" fill="none">
    <line x1="50" y1="20" x2="50" y2="80"/>
    <line x1="20" y1="50" x2="80" y2="50"/>
    <line x1="30" y1="30" x2="70" y2="70"/>
    <line x1="70" y1="30" x2="30" y2="70"/>
    <circle cx="50" cy="50" r="15" fill="none" stroke="url(#sparkle)" stroke-width="1.5"/>
    <circle cx="50" cy="50" r="25" fill="none" stroke="url(#sparkle)" stroke-width="1" opacity="0.6"/>
  </g>
</svg>