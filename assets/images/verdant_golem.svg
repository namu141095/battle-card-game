<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280">
  <defs>
    <linearGradient id="verdant1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7CFC00;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#228B22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#006400;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="verdantGlow" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#ADFFBE;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#006400;stop-opacity:0.3" />
    </radialGradient>
  </defs>
  
  <rect width="200" height="280" fill="url(#verdant1)" rx="8"/>
  <rect x="4" y="4" width="192" height="272" fill="none" stroke="#7CFC00" stroke-width="2" rx="6"/>
  
  <rect x="8" y="8" width="184" height="32" fill="#fff" opacity="0.9" rx="4"/>
  <text x="16" y="28" font-family="Arial" font-size="16" font-weight="bold" fill="#006400">Verdant Golem</text>
  <rect x="130" y="12" width="50" height="24" fill="#006400" rx="3"/>
  <text x="160" y="27" font-family="Arial" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">GRASS</text>
  
  <rect x="10" y="45" width="180" height="140" fill="url(#verdantGlow)" rx="4"/>
  
  <!-- Stone golem body -->
  <rect x="75" y="100" width="50" height="50" fill="#708090" rx="2"/>
  <rect x="65" y="85" width="70" height="30" fill="#A9A9A9" rx="3"/>
  
  <!-- Moss/grass on top -->
  <path d="M 70 80 L 75 65 L 85 75 L 95 60 L 105 75 L 115 65 L 130 80 Z" fill="#228B22"/>
  <path d="M 75 78 L 80 68 L 90 75 L 100 65 L 125 78" fill="#32CD32" opacity="0.8"/>
  
  <!-- Crystal/gem on chest -->
  <polygon points="100,110 95,115 100,125 105,115" fill="#7CFC00"/>
  
  <!-- Rock texture -->
  <circle cx="85" cy="100" r="2" fill="#606060"/>
  <circle cx="95" cy="108" r="2" fill="#606060"/>
  <circle cx="110" cy="115" r="2" fill="#606060"/>
  <circle cx="115" cy="105" r="2" fill="#606060"/>
  
  <!-- Eyes -->
  <circle cx="85" cy="90" r="3" fill="#FFD700"/>
  <circle cx="115" cy="90" r="3" fill="#FFD700"/>
  
  <rect x="10" y="190" width="180" height="50" fill="#fff" opacity="0.85" rx="3"/>
  <text x="16" y="207" font-family="Arial" font-size="10" font-weight="bold" fill="#333">HP: 130</text>
  <text x="16" y="222" font-family="Arial" font-size="10" font-weight="bold" fill="#333">ATK: 75 | DEF: 100</text>
  <text x="16" y="237" font-family="Arial" font-size="9" fill="#666">Stone creature high defense</text>
  
  <rect x="8" y="248" width="184" height="24" fill="#006400" rx="3"/>
  <text x="100" y="263" font-family="Arial" font-size="10" font-weight="bold" fill="#fff" text-anchor="middle">⚔ Battle Card</text>
